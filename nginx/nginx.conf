user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    upstream backend_server {
        server backend:8000;
    }

    upstream frontend_server {
        server frontend:80;
    }

    server {
        listen 80 ssl;
        server_name nexus.orbx.in;

        ssl_certificate /etc/letsencrypt/live/nexus.orbx.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nexus.orbx.in/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Auto-redirect plain HTTP requests on this port to HTTPS
        error_page 497 https://$http_host$request_uri;

        # API requests
        location /api/ {
            proxy_pass http://backend_server;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Swagger docs
        location /docs {
            proxy_pass http://backend_server/docs;
            proxy_set_header Host $http_host;
        }
        location /openapi.json {
            proxy_pass http://backend_server/openapi.json;
            proxy_set_header Host $http_host;
        }

        # Frontend static site routing
        location / {
            proxy_pass http://frontend_server;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
